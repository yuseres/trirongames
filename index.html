<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrironGames — A tiny indie game studio</title>
<meta name="description" content="TrironGames is a tiny one-person indie studio making cozy, colorful games. Color Boom is live, with more on the way." />
<meta name="theme-color" content="#B25C43" />
<link rel="canonical" href="https://yuseres.github.io/trirongames/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="TrironGames" />
<meta property="og:title" content="TrironGames — A tiny indie game studio" />
<meta property="og:description" content="A tiny one-person studio making cozy, colorful games. Color Boom is live, with more on the way." />
<meta property="og:url" content="https://yuseres.github.io/trirongames/" />
<meta property="og:image" content="https://yuseres.github.io/trirongames/assets/trirongames-banner.png" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="assets/trirongames-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/home.css" />
<script>
  /* pre-paint theme so there's no light flash in dark mode */
  try {
    var t = localStorage.getItem("triron-theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "TrironGames",
  "url": "https://yuseres.github.io/trirongames/",
  "logo": "https://yuseres.github.io/trirongames/assets/trirongames-icon.png",
  "email": "trirongames@gmail.com",
  "description": "A tiny one-person indie studio making cozy, colorful games."
}
</script>
</head>
<body>

<a class="skip-link" href="#games">Skip to games</a>
<div class="decor" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<header class="site-nav" id="site-nav"></header>

<main id="top">
  <section class="home-hero">
    <div class="wrap">
      <img class="mark" src="assets/trirongames-icon.png" alt="TrironGames logo" />
      <h1>TrironGames</h1>
      <p class="tag">A tiny one-person studio making cozy, colorful games. Color Boom is live — and we're just getting started.</p>
      <div class="actions">
        <a class="btn btn-primary" href="#games">See our games</a>
        <a class="btn btn-ghost" href="#studio">Meet the maker</a>
      </div>
    </div>
  </section>

  <section class="section" id="games">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow">Our games</span>
        <h2 class="section-title">One game live. More in the oven.</h2>
      </div>
      <div class="games-grid" id="games-grid" aria-live="polite"></div>
      <div class="codename-grid" id="codename-grid"></div>
      <noscript>
        <ul style="margin-top:24px; line-height:2; font-weight:700;">
          <li><a href="games/color-boom/index.html">Color Boom</a> — live now, a cozy color-by-number game.</li>
          <li><a href="games/animals-merge/index.html">Animals Merge</a> — a cozy merge puzzler, in development.</li>
        </ul>
      </noscript>
    </div>
  </section>

  <section class="section" id="roadmap" style="padding-top:0;">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow">Studio roadmap</span>
        <h2 class="section-title">Where everything stands.</h2>
      </div>
      <div class="roadmap-board" id="roadmap-board"></div>
    </div>
  </section>

  <section class="section" id="studio" style="padding-top:0;">
    <div class="wrap">
      <div class="who-panel">
        <div class="who-pill">Who I am</div>
        <p class="who-story" id="who-story"></p>
        <div class="maker-card" id="maker-card"></div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="data/studio.js"></script>
<script src="data/games.js"></script>
<script>
  window.PAGE = { base: "", kind: "studio", current: "" };
</script>
<script src="assets/js/site.js" defer></script>
<script src="assets/js/home.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var S = window.TRIRON_STUDIO || {};
    var story = document.getElementById("who-story");
    if (story && S.story) story.textContent = S.story;
    var m = S.maker, card = document.getElementById("maker-card");
    if (m && card) {
      card.style.setProperty("--accent", m.accent || "var(--primary)");
      card.innerHTML =
        '<div class="av-ring"><img class="av" src="' + m.photo + '" alt="' + m.name + '" loading="lazy" /></div>' +
        "<b>" + m.name + "</b>" +
        (m.role ? '<span class="role">' + m.role + "</span>" : "") +
        (m.bio ? '<p class="bio">' + m.bio + "</p>" : "");
    }
  });
</script>

</body>
</html>
